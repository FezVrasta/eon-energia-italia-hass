[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyeonenergia"
version = "0.1.0"
description = "Async client for the E.ON Energia (Italy) customer API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Federico Zivolo" }]
keywords = ["eon", "eon-energia", "energy", "electricity", "italy", "arera"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["aiohttp>=3.9", "cryptography>=41"]

[project.urls]
Homepage = "https://github.com/fezvrasta/eon-energia-italia-hass"
Issues = "https://github.com/fezvrasta/eon-energia-italia-hass/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyeonenergia"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
